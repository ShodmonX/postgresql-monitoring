# Sample config for Prometheus.

global:
  scrape_interval:     10s
  evaluation_interval: 10s


# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets: ['localhost:9093']


scrape_configs:
  - job_name: pg_exporter
    static_configs:
      - targets: ['pg-primary:9630']